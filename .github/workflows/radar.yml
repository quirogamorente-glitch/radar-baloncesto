name: Radar de baloncesto

on:
  schedule:
    - cron: "7,27,47 * * * *"   # cada 20 minutos
  workflow_dispatch: {}          # botón «Run workflow» para lanzarlo a mano

permissions:
  contents: write

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install feedparser pyyaml requests

      - name: Leer fuentes
        run: python radar.py

      - name: Guardar novedades
        run: |
          git config user.name "radar-baloncesto"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add noticias.json estado.json radar.md
          # radar.py solo reescribe los archivos si hay novedades reales
          if git diff --cached --quiet; then
            echo "Sin novedades"
          else
            git commit -m "Radar: novedades $(date -u +'%Y-%m-%d %H:%M') UTC"
            git pull --rebase --autostash || true
            git push
          fi
